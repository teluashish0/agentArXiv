name: Deploy Frontend to Vercel

on:
  push:
    paths:
      - .github/workflows/deploy-vercel-frontend.yml
      - apps/frontend/**
      - packages/artifacts/**
      - packages/core/**
      - packages/db/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_DEPLOY_ENABLED: ${{ vars.VERCEL_DEPLOY_ENABLED }}
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
  NEXT_PUBLIC_AGENTARXIV_ENABLE_GOOGLE_SIGN_IN: ${{ vars.NEXT_PUBLIC_AGENTARXIV_ENABLE_GOOGLE_SIGN_IN }}
  AGENTARXIV_APP_URL: ${{ vars.AGENTARXIV_APP_URL }}
  AGENTARXIV_CHATKIT_BACKEND_URL: ${{ vars.AGENTARXIV_CHATKIT_BACKEND_URL }}
  AGENTARXIV_CHATKIT_SHARED_SECRET: ${{ secrets.AGENTARXIV_CHATKIT_SHARED_SECRET }}
  AGENTARXIV_MCP_ENDPOINT: ${{ vars.AGENTARXIV_MCP_ENDPOINT }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  STRIPE_SANDBOX_PRICE_ID: ${{ vars.STRIPE_SANDBOX_PRICE_ID }}
  STRIPE_SANDBOX_PRODUCT_ID: ${{ vars.STRIPE_SANDBOX_PRODUCT_ID }}
  STRIPE_SANDBOX_PLAN_NAME: ${{ vars.STRIPE_SANDBOX_PLAN_NAME }}
  STRIPE_SANDBOX_PLAN_LOOKUP_KEY: ${{ vars.STRIPE_SANDBOX_PLAN_LOOKUP_KEY }}
  STRIPE_SANDBOX_USAGE_PRICE_ID: ${{ vars.STRIPE_SANDBOX_USAGE_PRICE_ID }}
  STRIPE_SANDBOX_METER_EVENT_NAME: ${{ vars.STRIPE_SANDBOX_METER_EVENT_NAME }}
  AGENTARXIV_SANDBOX_USAGE_PRICE_USD_PER_SECOND: ${{ vars.AGENTARXIV_SANDBOX_USAGE_PRICE_USD_PER_SECOND }}
  AGENTARXIV_SANDBOX_DEFAULT_USAGE_BUDGET_CENTS: ${{ vars.AGENTARXIV_SANDBOX_DEFAULT_USAGE_BUDGET_CENTS }}
  E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
  E2B_SANDBOX_TEMPLATE: ${{ secrets.E2B_SANDBOX_TEMPLATE }}
  AGENTARXIV_E2B_ALLOW_DEFAULT_TEMPLATE_FALLBACK: ${{ vars.AGENTARXIV_E2B_ALLOW_DEFAULT_TEMPLATE_FALLBACK }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  deploy:
    name: Vercel deploy scaffold
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        if: env.VERCEL_DEPLOY_ENABLED != 'true'
        run: |
          echo "Vercel deployment is scaffolded but disabled."
          echo "Set repo variable VERCEL_DEPLOY_ENABLED=true and provide VERCEL_ORG_ID, VERCEL_PROJECT_ID, and VERCEL_TOKEN to activate it."

      - name: Check out repository
        if: env.VERCEL_DEPLOY_ENABLED == 'true'
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: env.VERCEL_DEPLOY_ENABLED == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        if: env.VERCEL_DEPLOY_ENABLED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Vercel configuration
        if: env.VERCEL_DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          required=(
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
            VERCEL_TOKEN
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
            AGENTARXIV_APP_URL
            AGENTARXIV_CHATKIT_BACKEND_URL
            AGENTARXIV_CHATKIT_SHARED_SECRET
            AGENTARXIV_MCP_ENDPOINT
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            STRIPE_SANDBOX_PRICE_ID
            STRIPE_SANDBOX_PRODUCT_ID
            STRIPE_SANDBOX_PLAN_NAME
            STRIPE_SANDBOX_PLAN_LOOKUP_KEY
            STRIPE_SANDBOX_USAGE_PRICE_ID
            STRIPE_SANDBOX_METER_EVENT_NAME
            AGENTARXIV_SANDBOX_USAGE_PRICE_USD_PER_SECOND
            E2B_API_KEY
            E2B_SANDBOX_TEMPLATE
            DATABASE_URL
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required Vercel configuration: ${key}"
              exit 1
            fi
          done

      - name: Install dependencies
        if: env.VERCEL_DEPLOY_ENABLED == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: env.VERCEL_DEPLOY_ENABLED == 'true'
        run: pnpm db:generate

      - name: Pull Vercel project settings
        if: env.VERCEL_DEPLOY_ENABLED == 'true'
        shell: bash
        working-directory: apps/frontend
        run: |
          deploy_env=preview
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            deploy_env=production
          fi
          pnpm dlx vercel pull --yes --environment="${deploy_env}" --token="${VERCEL_TOKEN}"

      - name: Build frontend for Vercel
        if: env.VERCEL_DEPLOY_ENABLED == 'true'
        working-directory: apps/frontend
        run: pnpm dlx vercel build --token="${VERCEL_TOKEN}"

      - name: Deploy frontend to Vercel
        if: env.VERCEL_DEPLOY_ENABLED == 'true'
        shell: bash
        working-directory: apps/frontend
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            pnpm dlx vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
          else
            pnpm dlx vercel deploy --prebuilt --token="${VERCEL_TOKEN}"
          fi
