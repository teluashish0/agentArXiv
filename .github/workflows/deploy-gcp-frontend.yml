name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-gcp-frontend.yml
      - apps/frontend/**
      - packages/artifacts/**
      - packages/core/**
      - packages/db/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - turbo.json
      - .dockerignore
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-frontend-production
  cancel-in-progress: true

env:
  AGENTARXIV_GCP_PROJECT_ID: ${{ vars.AGENTARXIV_GCP_PROJECT_ID }}
  AGENTARXIV_GCP_REGION: ${{ vars.AGENTARXIV_GCP_REGION }}
  AGENTARXIV_GCP_ARTIFACT_REPO: ${{ vars.AGENTARXIV_GCP_ARTIFACT_REPO }}
  AGENTARXIV_GCP_FRONTEND_SERVICE: ${{ vars.AGENTARXIV_GCP_FRONTEND_SERVICE }}
  AGENTARXIV_GCP_DB_INSTANCE: ${{ vars.AGENTARXIV_GCP_DB_INSTANCE }}
  AGENTARXIV_GCP_DB_NAME: ${{ vars.AGENTARXIV_GCP_DB_NAME }}
  AGENTARXIV_GCP_DB_USER: ${{ vars.AGENTARXIV_GCP_DB_USER }}
  AGENTARXIV_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.AGENTARXIV_GCP_WORKLOAD_IDENTITY_PROVIDER }}
  AGENTARXIV_GCP_SERVICE_ACCOUNT: ${{ vars.AGENTARXIV_GCP_SERVICE_ACCOUNT }}
  AGENTARXIV_APP_URL: ${{ vars.AGENTARXIV_APP_URL }}
  AGENTARXIV_CHATKIT_BACKEND_URL: ${{ vars.AGENTARXIV_CHATKIT_BACKEND_URL }}
  AGENTARXIV_MCP_ENDPOINT: ${{ vars.AGENTARXIV_MCP_ENDPOINT }}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
  NEXT_PUBLIC_AGENTARXIV_ENABLE_GOOGLE_SIGN_IN: ${{ vars.NEXT_PUBLIC_AGENTARXIV_ENABLE_GOOGLE_SIGN_IN }}
  STRIPE_SANDBOX_PRICE_ID: ${{ vars.STRIPE_SANDBOX_PRICE_ID }}
  STRIPE_SANDBOX_PRODUCT_ID: ${{ vars.STRIPE_SANDBOX_PRODUCT_ID }}
  STRIPE_SANDBOX_PLAN_NAME: ${{ vars.STRIPE_SANDBOX_PLAN_NAME }}
  STRIPE_SANDBOX_PLAN_LOOKUP_KEY: ${{ vars.STRIPE_SANDBOX_PLAN_LOOKUP_KEY }}
  STRIPE_SANDBOX_USAGE_PRICE_ID: ${{ vars.STRIPE_SANDBOX_USAGE_PRICE_ID }}
  STRIPE_SANDBOX_METER_EVENT_NAME: ${{ vars.STRIPE_SANDBOX_METER_EVENT_NAME }}
  AGENTARXIV_SANDBOX_USAGE_PRICE_USD_PER_SECOND: ${{ vars.AGENTARXIV_SANDBOX_USAGE_PRICE_USD_PER_SECOND }}
  AGENTARXIV_SANDBOX_DEFAULT_USAGE_BUDGET_CENTS: ${{ vars.AGENTARXIV_SANDBOX_DEFAULT_USAGE_BUDGET_CENTS }}
  AGENTARXIV_E2B_ALLOW_DEFAULT_TEMPLATE_FALLBACK: ${{ vars.AGENTARXIV_E2B_ALLOW_DEFAULT_TEMPLATE_FALLBACK }}
  AGENTARXIV_GCP_DB_PASSWORD: ${{ secrets.AGENTARXIV_GCP_DB_PASSWORD }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  AGENTARXIV_CHATKIT_SHARED_SECRET: ${{ secrets.AGENTARXIV_CHATKIT_SHARED_SECRET }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
  E2B_SANDBOX_TEMPLATE: ${{ secrets.E2B_SANDBOX_TEMPLATE }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

jobs:
  validate:
    name: Validate frontend before deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://agentarxiv:agentarxiv@127.0.0.1:15432/agentarxiv?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build frontend
        run: pnpm --filter @agentarxiv/frontend build

  deploy:
    name: Build, push, and deploy frontend
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify deploy configuration
        shell: bash
        run: |
          required_vars=(
            AGENTARXIV_GCP_PROJECT_ID
            AGENTARXIV_GCP_REGION
            AGENTARXIV_GCP_ARTIFACT_REPO
            AGENTARXIV_GCP_FRONTEND_SERVICE
            AGENTARXIV_GCP_DB_INSTANCE
            AGENTARXIV_GCP_DB_NAME
            AGENTARXIV_GCP_DB_USER
            AGENTARXIV_GCP_WORKLOAD_IDENTITY_PROVIDER
            AGENTARXIV_GCP_SERVICE_ACCOUNT
            AGENTARXIV_APP_URL
            AGENTARXIV_CHATKIT_BACKEND_URL
            AGENTARXIV_MCP_ENDPOINT
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            STRIPE_SANDBOX_PRICE_ID
            STRIPE_SANDBOX_PRODUCT_ID
            STRIPE_SANDBOX_PLAN_NAME
            STRIPE_SANDBOX_PLAN_LOOKUP_KEY
            STRIPE_SANDBOX_USAGE_PRICE_ID
            STRIPE_SANDBOX_METER_EVENT_NAME
            AGENTARXIV_SANDBOX_USAGE_PRICE_USD_PER_SECOND
          )
          required_secrets=(
            AGENTARXIV_GCP_DB_PASSWORD
            CLERK_SECRET_KEY
            AGENTARXIV_CHATKIT_SHARED_SECRET
            OPENAI_API_KEY
            E2B_API_KEY
            E2B_SANDBOX_TEMPLATE
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
          )

          missing=0
          for key in "${required_vars[@]}" "${required_secrets[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required GitHub Actions configuration: ${key}"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.AGENTARXIV_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.AGENTARXIV_GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.AGENTARXIV_GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Artifact Registry Docker auth
        run: gcloud auth configure-docker "${AGENTARXIV_GCP_REGION}-docker.pkg.dev" --quiet

      - name: Verify required GCP resources exist
        shell: bash
        run: |
          gcloud artifacts repositories describe "${AGENTARXIV_GCP_ARTIFACT_REPO}" \
            --project "${AGENTARXIV_GCP_PROJECT_ID}" \
            --location "${AGENTARXIV_GCP_REGION}" >/dev/null

          gcloud sql instances describe "${AGENTARXIV_GCP_DB_INSTANCE}" \
            --project "${AGENTARXIV_GCP_PROJECT_ID}" >/dev/null

      - name: Apply Prisma schema to Cloud SQL
        shell: bash
        run: scripts/gcp/apply-cloudsql-schema.sh

      - name: Compute image tag
        id: image-meta
        shell: bash
        run: |
          image_base="${AGENTARXIV_GCP_REGION}-docker.pkg.dev/${AGENTARXIV_GCP_PROJECT_ID}/${AGENTARXIV_GCP_ARTIFACT_REPO}"
          image_tag="${GITHUB_SHA::12}"
          echo "frontend_image=${image_base}/frontend:${image_tag}" >>"$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.image-meta.outputs.frontend_image }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Deploy frontend to Cloud Run
        shell: bash
        env:
          AGENTARXIV_GCP_FRONTEND_IMAGE: ${{ steps.image-meta.outputs.frontend_image }}
        run: |
          connection_name="$(gcloud sql instances describe "${AGENTARXIV_GCP_DB_INSTANCE}" \
            --project "${AGENTARXIV_GCP_PROJECT_ID}" \
            --format='value(connectionName)')"

          run_database_url="postgresql://${AGENTARXIV_GCP_DB_USER}:${AGENTARXIV_GCP_DB_PASSWORD}@localhost/${AGENTARXIV_GCP_DB_NAME}?host=/cloudsql/${connection_name}&schema=public"

          env_vars=(
            "DATABASE_URL=${run_database_url}"
            "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
            "CLERK_SECRET_KEY=${CLERK_SECRET_KEY}"
            "NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}"
            "NEXT_PUBLIC_AGENTARXIV_ENABLE_GOOGLE_SIGN_IN=${NEXT_PUBLIC_AGENTARXIV_ENABLE_GOOGLE_SIGN_IN:-false}"
            "AGENTARXIV_APP_URL=${AGENTARXIV_APP_URL}"
            "AGENTARXIV_CHATKIT_BACKEND_URL=${AGENTARXIV_CHATKIT_BACKEND_URL}"
            "AGENTARXIV_CHATKIT_SHARED_SECRET=${AGENTARXIV_CHATKIT_SHARED_SECRET}"
            "AGENTARXIV_MCP_ENDPOINT=${AGENTARXIV_MCP_ENDPOINT}"
            "OPENAI_API_KEY=${OPENAI_API_KEY}"
            "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}"
            "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}"
            "STRIPE_SANDBOX_PRICE_ID=${STRIPE_SANDBOX_PRICE_ID}"
            "STRIPE_SANDBOX_PRODUCT_ID=${STRIPE_SANDBOX_PRODUCT_ID}"
            "STRIPE_SANDBOX_PLAN_NAME=${STRIPE_SANDBOX_PLAN_NAME}"
            "STRIPE_SANDBOX_PLAN_LOOKUP_KEY=${STRIPE_SANDBOX_PLAN_LOOKUP_KEY}"
            "STRIPE_SANDBOX_USAGE_PRICE_ID=${STRIPE_SANDBOX_USAGE_PRICE_ID}"
            "STRIPE_SANDBOX_METER_EVENT_NAME=${STRIPE_SANDBOX_METER_EVENT_NAME}"
            "AGENTARXIV_SANDBOX_USAGE_PRICE_USD_PER_SECOND=${AGENTARXIV_SANDBOX_USAGE_PRICE_USD_PER_SECOND}"
            "E2B_API_KEY=${E2B_API_KEY}"
            "E2B_SANDBOX_TEMPLATE=${E2B_SANDBOX_TEMPLATE}"
            "AGENTARXIV_E2B_ALLOW_DEFAULT_TEMPLATE_FALLBACK=${AGENTARXIV_E2B_ALLOW_DEFAULT_TEMPLATE_FALLBACK}"
          )

          if [[ -n "${AGENTARXIV_SANDBOX_DEFAULT_USAGE_BUDGET_CENTS:-}" ]]; then
            env_vars+=(
              "AGENTARXIV_SANDBOX_DEFAULT_USAGE_BUDGET_CENTS=${AGENTARXIV_SANDBOX_DEFAULT_USAGE_BUDGET_CENTS}"
            )
          fi

          gcloud run deploy "${AGENTARXIV_GCP_FRONTEND_SERVICE}" \
            --project "${AGENTARXIV_GCP_PROJECT_ID}" \
            --region "${AGENTARXIV_GCP_REGION}" \
            --image "${AGENTARXIV_GCP_FRONTEND_IMAGE}" \
            --port 8080 \
            --allow-unauthenticated \
            --add-cloudsql-instances "${connection_name}" \
            --startup-probe "initialDelaySeconds=5,timeoutSeconds=5,periodSeconds=10,failureThreshold=12,httpGet.path=/health,httpGet.port=8080" \
            --liveness-probe "timeoutSeconds=5,periodSeconds=30,failureThreshold=3,httpGet.path=/health,httpGet.port=8080" \
            --set-env-vars "$(IFS=,; echo "${env_vars[*]}")"

      - name: Smoke test deployed frontend
        shell: bash
        run: |
          frontend_url="$(gcloud run services describe "${AGENTARXIV_GCP_FRONTEND_SERVICE}" \
            --project "${AGENTARXIV_GCP_PROJECT_ID}" \
            --region "${AGENTARXIV_GCP_REGION}" \
            --format='value(status.url)')"

          curl --fail --silent --show-error "${frontend_url}/health" >/dev/null
          curl --fail --silent --show-error "${frontend_url}/api/papers?limit=1" >/dev/null
